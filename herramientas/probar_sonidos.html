<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probar sonidos</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #fde047; --new: #4ade80; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p.lead { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  section { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 20px; color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #334155; flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .name { flex: 1 1 180px; }
  .kind { color: var(--muted); font-size: 13px; }
  button { font: bold 15px Arial; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; background: #cbd5e1; color: #0f172a; }
  button.new { background: var(--new); }
  .tag { font-size: 12px; font-weight: bold; color: #0f172a; background: var(--new); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1>Sonidos de los distractores</h1>
  <p class="lead">Así suenan las cosas que cruzan por los bordes y los sonidos sueltos de cada mundo. Donde dice
    <span class="tag">NUEVO</span> hay versiones nuevas para comparar con la actual. Usa audífonos o parlantes:
    el avión (Superhéroes) pasa de un lado al otro.</p>
  <div id="list"></div>
</main>
<script src="../juego/nucleo/mundos.js"></script>
<script src="../juego/nucleo/sonido.js"></script>
<script src="../juego/modos/historia/mundos/superheroes.js"></script>
<script src="../juego/modos/historia/mundos/dragones.js"></script>
<script src="../juego/modos/historia/mundos/reino_magico.js"></script>
<script src="../juego/modos/historia/mundos/espacio.js"></script>
<script src="../juego/modos/historia/mundos/oceano.js"></script>
<script src="../juego/modos/historia/mundos/dinosaurios.js"></script>
<script src="../juego/modos/historia/mundos/robots.js"></script>
<script src="../juego/modos/historia/mundos/selva.js"></script>
<script src="../juego/modos/historia/mundos/dulces.js"></script>
<script>
// ---------- Versiones nuevas para comparar (usan envGain y chain de juego/nucleo/sonido.js) ----------
// Un "miau": tono que sube y baja, pasado por un filtro que se abre y se cierra como una boca (m → i → a → u)
function meow(o) {
  const ctx = getCtx(); if (!ctx) return;
  const t0 = ctx.currentTime + (o.delay || 0), len = o.len;
  const osc = ctx.createOscillator(); osc.type = o.wave;
  osc.frequency.setValueAtTime(o.f[0], t0);
  osc.frequency.exponentialRampToValueAtTime(o.f[1], t0 + len * 0.35);
  osc.frequency.exponentialRampToValueAtTime(o.f[2], t0 + len);
  const lfo = ctx.createOscillator(), lg = ctx.createGain();   // temblor de la voz
  lfo.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; lfo.connect(lg); lg.connect(osc.frequency);
  const mouth = ctx.createBiquadFilter(); mouth.type = 'lowpass'; mouth.Q.value = o.q;
  mouth.frequency.setValueAtTime(o.m[0], t0);
  mouth.frequency.exponentialRampToValueAtTime(o.m[1], t0 + len * 0.35);
  mouth.frequency.exponentialRampToValueAtTime(o.m[2], t0 + len);
  chain([osc, mouth, envGain(ctx, t0, o.vol, 0.05, len * 0.5, len * 0.45), ctx.destination]);
  osc.start(t0); lfo.start(t0); osc.stop(t0 + len + 0.05); lfo.stop(t0 + len + 0.05);
}
const CAT_VERSIONS = {
  // gatito: agudo, corto y tierno ("miu")
  'Gatito': () => meow({ wave: 'triangle', len: 0.5, f: [820, 1250, 760], m: [900, 4200, 1100], q: 4, vib: [8, 25], vol: 0.22 }),
  // gato de dibujo animado: más largo, con la boca bien marcada ("miaaau")
  'Gato de caricatura': () => meow({ wave: 'square', len: 0.8, f: [520, 760, 430], m: [500, 2600, 600], q: 7, vib: [6, 14], vol: 0.09 }),
  // dos maullidos seguidos, como si llamara ("miau, miau")
  'Miau doble': () => {
    meow({ wave: 'sawtooth', len: 0.42, f: [600, 880, 520], m: [600, 3000, 700], q: 6, vib: [7, 16], vol: 0.11 });
    meow({ wave: 'sawtooth', len: 0.5, f: [560, 820, 470], m: [600, 2800, 650], q: 6, vib: [7, 16], vol: 0.11, delay: 0.55 });
  }
};

// ---------- Lista ----------
const NAMES = { avion: 'Avión', pajaro: 'Pájaro', gato: 'Gato' };
const list = document.getElementById('list');
Object.keys(THEMES).forEach(key => {
  const D = DISTRACTORS[key], sec = document.createElement('section');
  sec.innerHTML = '<h2>' + THEMES[key].label + '</h2>';
  // extra: versiones nuevas para comparar, como [['Gatito', fn], ...]
  const add = (label, kind, play, extra) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<div class="name">' + label + (extra ? '<span class="tag">NUEVO</span>' : '') + '<div class="kind">' + kind + '</div></div>';
    const b1 = document.createElement('button'); b1.textContent = extra ? '▶ Actual' : '▶ Escuchar'; b1.onclick = () => { getCtx(); play(); };
    row.appendChild(b1);
    (extra || []).forEach(([name, fn]) => {
      const b = document.createElement('button'); b.className = 'new'; b.textContent = '▶ ' + name; b.onclick = () => { getCtx(); fn(); };
      row.appendChild(b);
    });
    sec.appendChild(row);
  };
  (D.visual || []).filter(v => v.sound).forEach(v => add(NAMES[v.name] || v.name.replace(/_/g, ' '), 'cruza por ' + (v.kind === 'walk' ? 'abajo' : 'arriba'), () => v.sound(),
    key === 'heroes' && v.name === 'gato' ? Object.entries(CAT_VERSIONS) : null));
  Object.entries(D.sounds || {}).forEach(([n, f]) => add(n.replace(/_/g, ' '), 'sonido suelto (sin imagen)', f));
  list.appendChild(sec);
});
</script>
</body>
</html>
