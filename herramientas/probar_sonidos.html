<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probar sonidos</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #fde047; --new: #4ade80; --amb: #93c5fd; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p.lead { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  section { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 20px; color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #334155; flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .name { flex: 1 1 180px; }
  .kind { color: var(--muted); font-size: 13px; }
  button { font: bold 15px Arial; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; background: #cbd5e1; color: #0f172a; }
  button.rec { background: var(--new); }
  button.amb { background: var(--amb); padding: 7px 10px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Sonidos de los distractores</h1>
  <p class="lead">Así suenan en el juego, con el volumen ya emparejado. Verde = grabación real · gris = hecho con código.
    Cada mundo tiene además sus sonidos de ambientación (en azul), que suenan más bajito de fondo cada 9 a 16 segundos.</p>
  <div id="list"></div>
</main>
<script>window.SFX_BASE = '../assets/';</script>
<script src="../assets/sonidos.js?v=3"></script>
<script src="../juego/nucleo/mundos.js?v=3"></script>
<script src="../juego/nucleo/sonido.js?v=3"></script>
<script src="../juego/modos/historia/mundos/superheroes.js?v=3"></script>
<script src="../juego/modos/historia/mundos/dragones.js?v=3"></script>
<script src="../juego/modos/historia/mundos/reino_magico.js?v=3"></script>
<script src="../juego/modos/historia/mundos/espacio.js?v=3"></script>
<script src="../juego/modos/historia/mundos/oceano.js?v=3"></script>
<script src="../juego/modos/historia/mundos/dinosaurios.js?v=3"></script>
<script src="../juego/modos/historia/mundos/robots.js?v=3"></script>
<script src="../juego/modos/historia/mundos/selva.js?v=3"></script>
<script src="../juego/modos/historia/mundos/dulces.js?v=3"></script>
<script>
const label = n => n.replace(/_/g, ' ');
const list = document.getElementById('list');
Object.keys(THEMES).forEach(key => {
  const D = DISTRACTORS[key], sec = document.createElement('section');
  sec.innerHTML = '<h2>' + THEMES[key].label + '</h2>';
  const row = (name, kind, play, rec) => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<div class="name">' + label(name) + '<div class="kind">' + kind + (rec ? ' · grabación real' : ' · hecho con código') + '</div></div>';
    const b = document.createElement('button'); if (rec) b.className = 'rec';
    b.textContent = '▶ Escuchar'; b.onclick = () => { getCtx(); play(); };
    r.appendChild(b); sec.appendChild(r);
  };
  // como en el juego: la grabación si la hay; si no, el sonido hecho con código
  (D.visual || []).filter(v => v.sound).forEach(v => row(v.name, 'cruza por ' + (v.kind === 'walk' ? 'abajo' : 'arriba'),
    () => playNamedSfx(v.name) || v.sound(1), !!SFX_FILES[v.name]));
  Object.entries(D.sounds || {}).forEach(([n, f]) => row(n, 'sonido suelto', () => playNamedSfx(n) || f(), !!SFX_FILES[n]));
  const amb = (SFX_AMBIENT[key] || []);
  if (amb.length) {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<div class="name">Ambientación<div class="kind">bajito, de fondo</div></div>';
    amb.forEach(a => {
      const b = document.createElement('button'); b.className = 'amb'; b.textContent = '▶ ' + label(a.name);
      b.onclick = () => { getCtx(); playSfx(a.file, AMBIENT_LEVEL); }; r.appendChild(b);
    });
    sec.appendChild(r);
  }
  list.appendChild(sec);
});
</script>
</body>
</html>
