<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="assets/manifest.js"></script>

<script src="juego/configuracion.js"></script>
<script src="juego/nucleo/mundos.js"></script>
<script src="juego/nucleo/imagenes.js"></script>

<script src="juego/arranque.js"></script>
