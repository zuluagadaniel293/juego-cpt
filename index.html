<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión Foco · Juego de atención</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23fde047' d='M12 2l3 7h7l-5.6 4.4L18.5 21 12 16.6 5.5 21l2.1-7.6L2 9h7z'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  #game { width: 100%; height: 100%; }
</style>
<link rel="stylesheet" href="juego/panel/panel.css">
</head>
<body>
<div id="game"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  // Archivos del juego, en orden (cada uno usa lo que cargaron los anteriores). Se piden siempre con ?v=hora para
  // que el navegador no use una versión vieja guardada después de cada cambio (las imágenes y sonidos sí se guardan).
  (function () {
    var v = Date.now();
    [
    'assets/manifest.js',
    'assets/voces.js',
    'assets/voces_eleven.js',
    'assets/sonidos.js',

    // Configuración y piezas compartidas
    'juego/configuracion.js',
    'juego/nucleo/mundos.js',
    'juego/nucleo/voces_comunes.js',
    'juego/nucleo/imagenes.js',
    'juego/nucleo/guardado.js',
    'juego/nucleo/sonido.js',
    'juego/nucleo/dibujos.js',
    'juego/nucleo/interfaz.js',
    'juego/nucleo/estadisticas.js',
    'juego/nucleo/sesiones.js',
    'juego/nucleo/mision_del_dia.js',
    'juego/nucleo/mision_perfecta.js',
    'juego/nucleo/giros.js',
    'juego/nucleo/hechizos.js',

    // Mundos (con sus 5 niveles). También los usa el Desafío.
    'juego/modos/historia/mundos/superheroes.js',
    'juego/modos/historia/mundos/dragones.js',
    'juego/modos/historia/mundos/reino_magico.js',
    'juego/modos/historia/mundos/espacio.js',
    'juego/modos/historia/mundos/oceano.js',
    'juego/modos/historia/mundos/dinosaurios.js',
    'juego/modos/historia/mundos/robots.js',
    'juego/modos/historia/mundos/selva.js',
    'juego/modos/historia/mundos/dulces.js',

    // Pantallas comunes y motor del juego
    'juego/escenas/inicio.js',
    'juego/escenas/jugadores.js',
    'juego/escenas/elegir_modo.js',
    'juego/escenas/elegir_mundo.js',
    'juego/escenas/juego.js',
    'juego/escenas/esquiva.js',
    'juego/escenas/camino.js',
    'juego/escenas/pausa.js',

    // Modo Historia
    'juego/modos/historia/mapa_mundos.js',
    'juego/escenas/mundo_desbloqueado.js',
    'juego/modos/historia/mapa_capitulos.js',
    'juego/modos/historia/escena_historia.js',
    'juego/modos/historia/resultados_historia.js',

    // Modo Desafío
    'juego/modos/desafio/elegir_minijuego.js',
    'juego/modos/desafio/resultados_desafio.js',

    // Modo Memoria
    'juego/modos/memoria/memoria.js',
    'juego/modos/memoria/resultados_memoria.js',

    // Prueba fija (zona de adultos)
    'juego/modos/prueba_fija/elegir_prueba.js',
    'juego/modos/prueba_fija/resultados_prueba.js',
    'juego/panel/panel.js',

    'juego/arranque.js'
    ].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
  })();
</script>
</body>
</html>
