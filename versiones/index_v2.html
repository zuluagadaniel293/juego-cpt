<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego de atención sostenida (CPT)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  #game { width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// ======================= CONFIGURACIÓN =======================
// Prueba fija: siempre los mismos parámetros, para poder comparar sesiones.
// Valores provisionales: confirmarlos con la revisión de literatura del CPT (Fase 1).
const CONFIG = {
  SESSION_MS: 120000,        // duración de la sesión (poner 20000 para probar rápido)
  STIMULUS_MS: 1000,         // tiempo que el estímulo está en pantalla
  ISI_MIN: 700,              // pausa mínima entre estímulos
  ISI_MAX: 1400,             // pausa máxima entre estímulos
  TARGET_PROB: 0.25,         // proporción de estímulos objetivo
  AUDIO_DISTRACTOR: true,    // distractor auditivo ON/OFF
  AUDIO_EVERY_MS: [20000, 35000] // cada cuánto suena el distractor (rango aleatorio)
};

// Modo Desafío: la dificultad depende del nivel (empieza fácil y corto).
const MINIGAMES = ['classic', 'catch', 'race'];
const MINIGAME_LABEL = { classic: 'Clásico', catch: 'Atrapa', race: 'Carrera' };
const MINIGAME_INSTR = {
  classic: 'Toca o presiona ESPACIO solo con',
  catch: 'Atrapa en la canasta solo',
  race: 'Salta solo para agarrar'
};

function challengeParams(level) {
  const L = level - 1;
  const isiMin = Math.max(400, 900 - 40 * L);
  return {
    sessionMs: Math.min(45000 + 5000 * L, 120000),   // 45 s en el nivel 1, +5 s por nivel, máx. 2 min
    stimMs: Math.max(550, 1200 - 50 * L),            // el estímulo dura menos en pantalla
    isiMin: isiMin,
    isiMax: isiMin + 600,
    targetProb: Math.max(0.15, 0.30 - 0.01 * L),     // menos objetivos = más difícil mantener la atención
    similarProb: level >= 4 ? Math.min(0.5, 0.15 + 0.05 * (level - 4)) : 0, // distractor parecido al objetivo
    audio: level >= 3,
    audioEvery: [Math.max(8000, 20000 - 1000 * L), Math.max(12000, 35000 - 1500 * L)],
    minigame: MINIGAMES[L % MINIGAMES.length]
  };
}

function pruebaParams() {
  return {
    sessionMs: CONFIG.SESSION_MS,
    stimMs: CONFIG.STIMULUS_MS,
    isiMin: CONFIG.ISI_MIN,
    isiMax: CONFIG.ISI_MAX,
    targetProb: CONFIG.TARGET_PROB,
    similarProb: 0,
    audio: CONFIG.AUDIO_DISTRACTOR,
    audioEvery: CONFIG.AUDIO_EVERY_MS,
    minigame: 'classic'
  };
}

const THEMES = {
  heroes:  { label: 'Superhéroes',          bg: 0x0f2a4a, accent: 0xfde047, targetName: 'la señal del villano' },
  fantasy: { label: 'Dragones y fantasía',  bg: 0x1f3a2a, accent: 0xfacc15, targetName: 'el huevo dorado del dragón' },
  kingdom: { label: 'Reino mágico',         bg: 0x4a1d4a, accent: 0xf472b6, targetName: 'la joya de la corona' }
};
const hexColor = n => '#' + n.toString(16).padStart(6, '0');

// ======================= GUARDADO (récords del Desafío) =======================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin guardado disponible */ } }
};
const getRecords = () => store.get('cpt_records', {});

// ======================= AUDIO (Web Audio, sin archivos) =======================
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, vol, type) {
  const ctx = getCtx();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + dur);
}
function distractorSound() {            // sonido disonante que funciona como distractor
  tone(220, 0.6, 0.25, 'sawtooth');
  tone(233, 0.6, 0.25, 'sawtooth');
}
function rewardSound() {                // refuerzo positivo
  tone(660, 0.12, 0.12, 'sine');
  setTimeout(() => tone(880, 0.15, 0.12, 'sine'), 90);
}

// ======================= TEXTURAS (figuras dibujadas por código) =======================
function starPoints(cx, cy, R, r) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const d = i % 2 ? r : R;
    p.push({ x: cx + d * Math.cos(a), y: cy + d * Math.sin(a) });
  }
  return p;
}

function buildTextures(scene) {
  const S = 160;
  const make = (key, drawFn) => {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    drawFn(g);
    g.generateTexture(key, S, S);
    g.destroy();
  };

  // --- Superhéroes ---
  const rombo = g => { g.fillStyle(0x7c3aed, 1); g.fillPoints([{x:80,y:6},{x:154,y:80},{x:80,y:154},{x:6,y:80}], true); };
  make('heroes_target', g => {
    rombo(g);
    g.fillStyle(0xfde047, 1);
    g.fillPoints([{x:92,y:24},{x:54,y:88},{x:80,y:88},{x:66,y:136},{x:110,y:72},{x:84,y:72}], true);
  });
  make('heroes_dist1', g => { g.fillStyle(0x38bdf8, 1); g.fillCircle(80, 80, 58); });
  make('heroes_dist2', g => {
    g.fillStyle(0xe2e8f0, 1);
    g.fillEllipse(58, 95, 70, 50);
    g.fillEllipse(102, 95, 70, 50);
    g.fillEllipse(80, 70, 70, 55);
  });
  make('heroes_dist3', rombo);   // parecido al objetivo: rombo sin rayo

  // --- Dragones y fantasía ---
  const egg = (g, color) => { g.fillStyle(color, 1); g.fillEllipse(80, 86, 100, 130); };
  make('fantasy_target', g => {
    egg(g, 0xfacc15);
    g.fillStyle(0xf59e0b, 1);
    g.fillCircle(65, 70, 8); g.fillCircle(98, 100, 10); g.fillCircle(75, 118, 7);
    g.fillStyle(0xffffff, 0.5); g.fillEllipse(62, 58, 18, 26);
  });
  make('fantasy_dist1', g => egg(g, 0xbbf7d0));
  make('fantasy_dist2', g => egg(g, 0xbfdbfe));
  make('fantasy_dist3', g => {   // parecido al objetivo: huevo dorado sin manchas
    egg(g, 0xfacc15);
    g.fillStyle(0xffffff, 0.5); g.fillEllipse(62, 58, 18, 26);
  });

  // --- Reino mágico ---
  const gem = [{x:50,y:20},{x:110,y:20},{x:148,y:62},{x:80,y:148},{x:12,y:62}];
  make('kingdom_target', g => {
    g.fillStyle(0xf472b6, 1);
    g.fillPoints(gem, true);
    g.fillStyle(0xfbcfe8, 1);
    g.fillTriangle(50, 20, 110, 20, 80, 62);
    g.fillStyle(0xffffff, 0.6);
    g.fillTriangle(50, 20, 12, 62, 80, 62);
  });
  make('kingdom_dist1', g => { g.fillStyle(0x94a3b8, 1); g.fillEllipse(80, 95, 110, 80); });
  make('kingdom_dist2', g => {
    g.fillStyle(0xa8a29e, 1); g.fillEllipse(80, 100, 100, 70);
    g.fillStyle(0xd6d3d1, 1); g.fillEllipse(60, 85, 30, 18);
  });
  make('kingdom_dist3', g => { g.fillStyle(0xf472b6, 1); g.fillPoints(gem, true); }); // joya sin tallar

  // --- Personaje de la carrera (uno por temática, con su color de acento) ---
  Object.keys(THEMES).forEach(key => make('runner_' + key, g => {
    g.fillStyle(0x0f172a, 1);
    g.fillRect(58, 128, 14, 24); g.fillRect(88, 128, 14, 24);
    g.fillStyle(THEMES[key].accent, 1);
    g.fillRoundedRect(40, 24, 80, 110, 30);
    g.fillStyle(0xffffff, 1); g.fillCircle(65, 62, 11); g.fillCircle(95, 62, 11);
    g.fillStyle(0x0f172a, 1); g.fillCircle(69, 63, 5); g.fillCircle(99, 63, 5);
  }));

  // --- Canasta del minijuego Atrapa ---
  make('basket', g => {
    g.fillStyle(0x92400e, 1);
    g.fillPoints([{x:12,y:70},{x:148,y:70},{x:128,y:140},{x:32,y:140}], true);
    g.lineStyle(4, 0x78350f, 1);
    g.lineBetween(40, 92, 120, 92); g.lineBetween(46, 116, 114, 116);
    g.fillStyle(0xb45309, 1); g.fillRoundedRect(4, 60, 152, 16, 6);
  });

  // --- Iconos del selector de modo ---
  make('icon_map', g => {
    g.fillStyle(0x38bdf8, 1);
    g.fillPoints([{x:10,y:40},{x:55,y:28},{x:55,y:128},{x:10,y:140}], true);
    g.fillPoints([{x:105,y:40},{x:150,y:28},{x:150,y:128},{x:105,y:140}], true);
    g.fillStyle(0x7dd3fc, 1);
    g.fillPoints([{x:55,y:28},{x:105,y:40},{x:105,y:140},{x:55,y:128}], true);
    g.lineStyle(6, 0xef4444, 1);
    g.lineBetween(116, 54, 132, 70); g.lineBetween(132, 54, 116, 70);
  });
  make('icon_trophy', g => {
    g.lineStyle(8, 0xfb923c, 1);
    g.strokeCircle(40, 52, 16); g.strokeCircle(120, 52, 16);
    g.fillStyle(0xfb923c, 1);
    g.fillRect(44, 24, 72, 40); g.fillCircle(80, 64, 36);
    g.fillRect(72, 98, 16, 22);
    g.fillStyle(0xc2410c, 1); g.fillRoundedRect(48, 118, 64, 18, 5);
    g.fillStyle(0xfff7ed, 1); g.fillPoints(starPoints(80, 58, 18, 8), true);
  });
}

// ======================= UTILIDADES =======================
function makeButton(scene, x, y, w, h, label, color, cb) {
  const r = scene.add.rectangle(x, y, w, h, color).setInteractive({ useHandCursor: true });
  scene.add.text(x, y, label, { font: 'bold 22px Arial', color: '#0f172a' }).setOrigin(0.5);
  r.on('pointerdown', cb);
  r.on('pointerover', () => r.setAlpha(0.85));
  r.on('pointerout', () => r.setAlpha(1));
  return r;
}

function drawCard(scene, x, y, w, h, fill, fillAlpha, stroke) {
  const g = scene.add.graphics();
  g.fillStyle(fill, fillAlpha);
  g.fillRoundedRect(x - w / 2, y - h / 2, w, h, 24);
  if (stroke !== undefined) {
    g.lineStyle(4, stroke, 1);
    g.strokeRoundedRect(x - w / 2, y - h / 2, w, h, 24);
  }
  return g;
}

function computeStats(log) {
  const st = log.filter(r => r.event_type === 'stimulus');
  const targets = st.filter(r => r.stimulus_type === 'target');
  const dists = st.filter(r => r.stimulus_type === 'distractor');
  const hits = targets.filter(r => r.outcome === 'hit');
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
  const sd = a => {
    if (a.length < 2) return NaN;
    const m = mean(a);
    return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1));
  };
  const rts = hits.map(r => r.rt_ms);
  const lastOnset = st.length ? Math.max(...st.map(r => r.onset_ms)) : 0;
  const half = lastOnset / 2;
  return {
    targets: targets.length,
    hits: hits.length,
    omissions: targets.length - hits.length,
    distractors: dists.length,
    commissions: dists.filter(r => r.outcome === 'commission').length,
    hitRate: targets.length ? hits.length / targets.length : 0,
    meanRT: mean(rts),
    sdRT: sd(rts),
    cv: sd(rts) / mean(rts),
    rtFirst: mean(hits.filter(r => r.onset_ms <= half).map(r => r.rt_ms)),
    rtSecond: mean(hits.filter(r => r.onset_ms > half).map(r => r.rt_ms))
  };
}

// Estrellas del Desafío: premian precisión (aciertos y pocas comisiones), no velocidad.
function starsFor(s) {
  const hitRate = s.targets ? s.hitRate : 1;
  const commRate = s.distractors ? s.commissions / s.distractors : 0;
  if (hitRate >= 0.9 && commRate <= 0.1) return 3;
  if (hitRate >= 0.75 && commRate <= 0.25) return 2;
  if (hitRate >= 0.5 && commRate <= 0.4) return 1;
  return 0;
}

function downloadCSV(log, name) {
  const cols = ['event_type', 'mode', 'theme', 'level', 'minigame', 'trial', 'stimulus_type', 'stimulus_key',
    'onset_ms', 'responded', 'rt_ms', 'outcome'];
  const lines = [cols.join(',')].concat(
    log.map(r => cols.map(c => (r[c] === undefined ? '' : r[c])).join(','))
  );
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cpt_' + name + '_' + Date.now() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ======================= ESCENAS =======================
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    buildTextures(this);
    this.scene.start('Mode');
  }
}

class ModeScene extends Phaser.Scene {
  constructor() { super('Mode'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor(0x0f172a);
    this.add.text(W / 2, 70, '¿Cómo quieres jugar?', { font: 'bold 42px Arial', color: '#ffffff' }).setOrigin(0.5);

    // Historia: todavía no está programada
    drawCard(this, 290, 290, 360, 300, 0xffffff, 0.06, 0x38bdf8).setAlpha(0.45);
    this.add.image(290, 220, 'icon_map').setScale(0.75).setAlpha(0.45);
    this.add.text(290, 320, 'Historia', { font: 'bold 32px Arial', color: '#ffffff' }).setOrigin(0.5).setAlpha(0.45);
    this.add.text(290, 368, '¡Muy pronto!', { font: 'bold 20px Arial', color: '#38bdf8' }).setOrigin(0.5);

    // Desafío
    const card = drawCard(this, 670, 290, 360, 300, 0xffffff, 0.06, 0xfb923c);
    this.add.image(670, 220, 'icon_trophy').setScale(0.75);
    this.add.text(670, 315, 'Desafío', { font: 'bold 32px Arial', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(670, 365, 'Cada vez más difícil.\n¿Hasta qué nivel llegas?',
      { font: '18px Arial', color: '#cbd5e1', align: 'center' }).setOrigin(0.5);
    const best = Math.max(0, ...Object.values(getRecords()));
    if (best > 0) {
      this.add.text(670, 418, 'Tu récord: nivel ' + best, { font: 'bold 17px Arial', color: '#fb923c' }).setOrigin(0.5);
    }
    const zone = this.add.zone(670, 290, 360, 300).setInteractive({ useHandCursor: true });
    zone.on('pointerover', () => card.setAlpha(0.8));
    zone.on('pointerout', () => card.setAlpha(1));
    zone.on('pointerdown', () => { getCtx(); this.scene.start('Menu', { mode: 'desafio' }); });

    // Zona de adultos: prueba fija para comparar sesiones
    this.add.text(W - 30, H - 24, 'Zona de adultos: Prueba fija', { font: 'bold 15px Arial', color: '#94a3b8' })
      .setOrigin(1, 1).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => { getCtx(); this.scene.start('Menu', { mode: 'prueba' }); });
  }
}

class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  init(data) { this.mode = data.mode || 'prueba'; }
  create() {
    const W = this.scale.width;
    const isChallenge = this.mode === 'desafio';
    const records = getRecords();
    this.cameras.main.setBackgroundColor(0x0f172a);
    this.add.text(30, 26, '‹ Volver', { font: 'bold 20px Arial', color: '#cbd5e1' })
      .setInteractive({ useHandCursor: true }).on('pointerdown', () => this.scene.start('Mode'));
    this.add.text(W / 2, 60, isChallenge ? 'Desafío: elige tu mundo' : 'Elige tu aventura',
      { font: 'bold 44px Arial', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 110, isChallenge
      ? 'Cada nivel es un poco más difícil. ¿Hasta dónde llegas?'
      : 'Toca la pantalla o presiona ESPACIO solo cuando aparezca el objeto especial',
      { font: '20px Arial', color: '#cbd5e1' }).setOrigin(0.5);

    const keys = Object.keys(THEMES);
    keys.forEach((key, i) => {
      const th = THEMES[key];
      const x = 170 + i * 310;
      const y = 330;
      const card = this.add.rectangle(x, y, 270, 330, th.bg).setStrokeStyle(4, th.accent).setInteractive({ useHandCursor: true });
      this.add.image(x, y - 70, key + '_target').setScale(0.8);
      this.add.text(x, y + 30, th.label, { font: 'bold 24px Arial', color: '#ffffff' }).setOrigin(0.5);
      this.add.text(x, y + 75, 'Objeto especial:\n' + th.targetName,
        { font: '17px Arial', color: '#e2e8f0', align: 'center' }).setOrigin(0.5);
      if (isChallenge) {
        const rec = records[key] || 0;
        this.add.text(x, y + 135, rec ? 'Récord: nivel ' + rec : '¡Sin récord aún!',
          { font: 'bold 18px Arial', color: hexColor(th.accent) }).setOrigin(0.5);
      }
      card.on('pointerover', () => card.setScale(1.04));
      card.on('pointerout', () => card.setScale(1));
      card.on('pointerdown', () => {
        getCtx(); // activa el audio con el primer clic
        if (isChallenge) {
          this.registry.set('runLog', []);
          const start = Math.max(1, (records[key] || 0) - 2); // retoma cerca de su récord
          this.scene.start('Game', { mode: 'desafio', theme: key, level: start });
        } else {
          this.scene.start('Game', { mode: 'prueba', theme: key });
        }
      });
    });
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }
  init(data) {
    this.mode = data.mode;
    this.themeKey = data.theme;
    this.theme = THEMES[data.theme];
    this.level = data.level || null;
    this.params = this.mode === 'desafio' ? challengeParams(this.level) : pruebaParams();
    this.mg = this.params.minigame;
  }
  create() {
    const W = this.scale.width, H = this.scale.height;
    const th = this.theme;
    this.cameras.main.setBackgroundColor(th.bg);
    this.log = [];
    this.trial = 0;
    this.current = null;
    this.started = false;
    this.ended = false;

    // Barra de progreso (en Desafío, con el nivel a la izquierda)
    let barX = 40;
    if (this.mode === 'desafio') {
      const pill = this.add.graphics();
      pill.fillStyle(th.accent, 0.18);
      pill.fillRoundedRect(20, 6, 110, 28, 14);
      this.add.text(75, 20, 'Nivel ' + this.level, { font: 'bold 16px Arial', color: hexColor(th.accent) }).setOrigin(0.5);
      barX = 146;
    }
    this.barW = W - barX - 40;
    this.add.rectangle(barX, 20, this.barW, 10, 0xffffff, 0.2).setOrigin(0, 0.5);
    this.bar = this.add.rectangle(barX, 20, 0, 10, th.accent).setOrigin(0, 0.5);

    this.setupMinigame();
    this.stim = this.add.image(W / 2, H / 2, this.themeKey + '_target').setVisible(false).setDepth(5);
    const fbY = this.mg === 'classic' ? H / 2 + 140 : 90;
    this.fb = this.add.text(W / 2, fbY, '', { font: 'bold 38px Arial', color: '#86efac' }).setOrigin(0.5).setDepth(6);

    // Pantalla de preparación
    this.intro = [this.add.image(W / 2, H / 2 - 90, this.themeKey + '_target')];
    if (this.mode === 'desafio') {
      this.intro.push(this.add.text(W / 2, H / 2 + 25, 'Nivel ' + this.level + ' · ' + MINIGAME_LABEL[this.mg],
        { font: 'bold 32px Arial', color: hexColor(th.accent) }).setOrigin(0.5));
      this.intro.push(this.add.text(W / 2, H / 2 + 90, MINIGAME_INSTR[this.mg] + '\n' + th.targetName,
        { font: 'bold 24px Arial', color: '#ffffff', align: 'center' }).setOrigin(0.5));
    } else {
      this.intro.push(this.add.text(W / 2, H / 2 + 60, 'Prepárate...\nResponde solo con ' + th.targetName,
        { font: 'bold 28px Arial', color: '#ffffff', align: 'center' }).setOrigin(0.5));
    }

    this.input.keyboard.on('keydown-SPACE', () => this.respond());
    this.input.on('pointerdown', () => this.respond());
    this.time.delayedCall(this.mode === 'desafio' ? 3000 : 2500, () => this.begin());
  }

  // Elementos propios de cada minijuego (ocultos hasta que empieza)
  setupMinigame() {
    const W = this.scale.width, H = this.scale.height;
    this.mgObjects = [];
    if (this.mg === 'catch') {
      this.basket = this.add.image(W / 2, H - 70, 'basket').setScale(0.9);
      this.mgObjects.push(this.basket);
    } else if (this.mg === 'race') {
      this.mgObjects.push(this.add.rectangle(0, 430, W, 110, 0x000000, 0.25).setOrigin(0, 0));
      this.dashes = [];
      for (let i = 0; i < 9; i++) {
        const d = this.add.rectangle(i * 120, 480, 60, 8, 0xffffff, 0.25).setOrigin(0, 0.5);
        this.dashes.push(d);
        this.mgObjects.push(d);
      }
      this.runner = this.add.image(200, 370, 'runner_' + this.themeKey).setScale(0.6).setDepth(4);
      this.mgObjects.push(this.runner);
      this.bob = this.tweens.add({ targets: this.runner, y: 362, duration: 180, yoyo: true, repeat: -1 });
      this.raceSpeed = (W + 40 - 200) / this.params.stimMs * 1000; // px/s, igual que los objetos
    }
    this.mgObjects.forEach(o => o.setVisible(false));
  }

  begin() {
    this.intro.forEach(o => o.destroy());
    this.mgObjects.forEach(o => o.setVisible(true));
    this.t0 = performance.now();
    this.started = true;
    this.nextTrial();
    this.scheduleAudio();
  }

  update(time, delta) {
    if (this.started && !this.ended) {
      const el = performance.now() - this.t0;
      this.bar.width = this.barW * Math.min(1, el / this.params.sessionMs);
      if (this.mg === 'race') {
        const dx = this.raceSpeed * delta / 1000;
        this.dashes.forEach(d => { d.x -= dx; if (d.x < -60) d.x += 9 * 120; });
      }
    }
  }

  nextTrial() {
    const P = this.params;
    if (performance.now() - this.t0 >= P.sessionMs) { this.finish(); return; }
    this.trial++;
    const isTarget = Math.random() < P.targetProb;
    let key;
    if (isTarget) key = this.themeKey + '_target';
    else if (Math.random() < P.similarProb) key = this.themeKey + '_dist3';
    else key = this.themeKey + '_dist' + Phaser.Math.Between(1, 2);
    this.presentStim(key);
    this.current = {
      trial: this.trial,
      type: isTarget ? 'target' : 'distractor',
      key: key,
      onset: performance.now(),
      responded: false,
      rt: null
    };
    this.time.delayedCall(P.stimMs, () => this.endTrial());
  }

  presentStim(key) {
    const W = this.scale.width, H = this.scale.height;
    const s = this.stim;
    this.tweens.killTweensOf(s);
    s.setTexture(key).setVisible(true).setAlpha(1).setScale(1).setAngle(0);
    if (this.mg === 'classic') {
      s.setPosition(W / 2, H / 2);
    } else if (this.mg === 'catch') {
      s.setPosition(W / 2, 70).setScale(0.75);
      this.tweens.add({ targets: s, y: H - 170, duration: this.params.stimMs });
    } else {
      s.setPosition(W + 40, 290).setScale(0.55);
      this.tweens.add({ targets: s, x: 200, duration: this.params.stimMs });
    }
  }

  endTrial() {
    const c = this.current;
    // si atrapó el objetivo, la animación de premio se encarga de ocultarlo
    if (!(c.responded && c.type === 'target')) {
      this.tweens.killTweensOf(this.stim);
      this.stim.setVisible(false);
    }
    let outcome;
    if (c.type === 'target') outcome = c.responded ? 'hit' : 'omission';
    else outcome = c.responded ? 'commission' : 'correct_rejection';
    this.log.push({
      event_type: 'stimulus',
      mode: this.mode,
      theme: this.themeKey,
      level: this.level || '',
      minigame: this.mg,
      trial: c.trial,
      stimulus_type: c.type,
      stimulus_key: c.key,
      onset_ms: Math.round(c.onset - this.t0),
      responded: c.responded ? 1 : 0,
      rt_ms: c.rt === null ? '' : Math.round(c.rt),
      outcome: outcome
    });
    this.current = null;
    this.time.delayedCall(Phaser.Math.Between(this.params.isiMin, this.params.isiMax), () => this.nextTrial());
  }

  respond() {
    const c = this.current;
    if (!this.started || this.ended || !c || c.responded) return;
    c.responded = true;
    c.rt = performance.now() - c.onset;
    if (c.type === 'target') this.feedbackHit();
    else this.feedbackCommission();
  }

  ring(x, y) {
    const r = this.add.circle(x, y, 90).setStrokeStyle(8, 0x86efac).setDepth(6);
    this.tweens.add({ targets: r, scale: 1.6, alpha: 0, duration: 500, onComplete: () => r.destroy() });
  }

  // refuerzo positivo
  feedbackHit() {
    const W = this.scale.width, H = this.scale.height;
    const s = this.stim;
    rewardSound();
    this.fb.setText('¡Bien!').setAlpha(1);
    this.tweens.add({ targets: this.fb, alpha: 0, duration: 600 });
    if (this.mg === 'classic') {
      this.ring(W / 2, H / 2);
    } else if (this.mg === 'catch') {
      this.tweens.killTweensOf(s);
      this.tweens.add({ targets: s, y: this.basket.y - 10, scale: 0.3, alpha: 0, duration: 250 });
      this.tweens.add({ targets: this.basket, scale: 1.05, duration: 120, yoyo: true });
      this.ring(this.basket.x, this.basket.y);
    } else {
      this.tweens.killTweensOf(s);
      this.bob.pause();
      this.tweens.add({ targets: this.runner, y: 300, duration: 150, yoyo: true, onComplete: () => this.bob.resume() });
      this.tweens.add({ targets: s, x: this.runner.x, y: 300, scale: 0.2, alpha: 0, duration: 250 });
      this.ring(this.runner.x, 320);
    }
  }

  // error de comisión: feedback neutro, sin castigo
  feedbackCommission() {
    this.stim.setAlpha(0.35);
    if (this.mg === 'catch') {
      this.tweens.add({ targets: this.basket, x: this.basket.x + 8, duration: 60, yoyo: true, repeat: 1 });
    } else if (this.mg === 'race') {
      this.tweens.add({ targets: this.runner, angle: 12, duration: 120, yoyo: true });
    }
  }

  scheduleAudio() {
    const P = this.params;
    if (!P.audio) return;
    const d = Phaser.Math.Between(P.audioEvery[0], P.audioEvery[1]);
    this.time.delayedCall(d, () => {
      if (this.ended) return;
      distractorSound();
      this.log.push({
        event_type: 'audio_distractor',
        mode: this.mode,
        theme: this.themeKey,
        level: this.level || '',
        minigame: this.mg,
        onset_ms: Math.round(performance.now() - this.t0)
      });
      this.scheduleAudio();
    });
  }

  finish() {
    this.ended = true;
    if (this.mode === 'desafio') {
      this.scene.start('ChallengeResults', { log: this.log, theme: this.themeKey, level: this.level });
    } else {
      this.scene.start('Results', { log: this.log, theme: this.themeKey });
    }
  }
}

// Resultados de la Prueba fija (métricas completas para el adulto)
class ResultsScene extends Phaser.Scene {
  constructor() { super('Results'); }
  init(data) {
    this.log = data.log;
    this.themeKey = data.theme;
  }
  create() {
    const W = this.scale.width;
    const th = THEMES[this.themeKey];
    this.cameras.main.setBackgroundColor(th.bg);
    const s = computeStats(this.log);
    const ms = v => (isNaN(v) ? '—' : Math.round(v) + ' ms');
    const stars = s.hitRate >= 0.9 ? 3 : s.hitRate >= 0.7 ? 2 : 1;

    this.add.text(W / 2, 55, '¡Buen trabajo!', { font: 'bold 46px Arial', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 120, '★'.repeat(stars) + '☆'.repeat(3 - stars),
      { font: '52px Arial', color: '#fde047' }).setOrigin(0.5);

    const lines = [
      'Objetivos detectados: ' + s.hits + ' de ' + s.targets + ' (' + Math.round(s.hitRate * 100) + '%)',
      'Omisiones (no detectó el objetivo): ' + s.omissions,
      'Respuestas a distractores (comisiones): ' + s.commissions + ' de ' + s.distractors,
      'Tiempo de reacción promedio: ' + ms(s.meanRT),
      'Variabilidad del TR (desv. estándar): ' + ms(s.sdRT),
      'TR primera mitad vs. segunda mitad: ' + ms(s.rtFirst) + ' → ' + ms(s.rtSecond)
    ];
    this.add.text(W / 2, 290, lines.join('\n'),
      { font: '24px Arial', color: '#f1f5f9', align: 'center', lineSpacing: 12 }).setOrigin(0.5);

    makeButton(this, W / 2 - 170, 470, 300, 60, 'Descargar CSV', 0xfde047, () => downloadCSV(this.log, 'prueba_' + this.themeKey));
    makeButton(this, W / 2 + 170, 470, 300, 60, 'Jugar de nuevo', 0x86efac, () => this.scene.start('Menu', { mode: 'prueba' }));
  }
}

// Resultados de cada nivel del Desafío: estrellas y cambio de nivel automático
class ChallengeResultsScene extends Phaser.Scene {
  constructor() { super('ChallengeResults'); }
  init(data) {
    this.log = data.log;
    this.themeKey = data.theme;
    this.level = data.level;
  }
  create() {
    const W = this.scale.width;
    const th = THEMES[this.themeKey];
    const accent = hexColor(th.accent);
    this.cameras.main.setBackgroundColor(th.bg);

    const runLog = (this.registry.get('runLog') || []).concat(this.log);
    this.registry.set('runLog', runLog);

    const s = computeStats(this.log);
    const stars = starsFor(s);
    // 2 o 3 estrellas: sube · 1: repite · 0: baja para practicar
    const next = stars >= 2 ? this.level + 1 : stars === 0 ? Math.max(1, this.level - 1) : this.level;

    const records = getRecords();
    const newRecord = stars >= 2 && this.level > (records[this.themeKey] || 0);
    if (newRecord) {
      records[this.themeKey] = this.level;
      store.set('cpt_records', records);
    }

    const title = stars >= 2 ? '¡Excelente!' : stars === 1 ? '¡Buen intento!' : '¡Sigue practicando!';
    this.add.text(W / 2, 60, title, { font: 'bold 46px Arial', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 130, '★'.repeat(stars) + '☆'.repeat(3 - stars),
      { font: '56px Arial', color: '#fde047' }).setOrigin(0.5);
    this.add.text(W / 2, 215, 'Atrapaste ' + s.hits + ' de ' + s.targets +
      '\nTe equivocaste ' + s.commissions + (s.commissions === 1 ? ' vez' : ' veces'),
      { font: '24px Arial', color: '#f1f5f9', align: 'center', lineSpacing: 8 }).setOrigin(0.5);

    const msg = next > this.level ? '¡Subes al nivel ' + next + '!'
      : next < this.level ? 'Bajamos al nivel ' + next + ' para practicar'
      : 'Repite el nivel ' + this.level + ', ¡tú puedes!';
    this.add.text(W / 2, 300, msg, { font: 'bold 30px Arial', color: accent }).setOrigin(0.5);
    if (newRecord) {
      this.add.text(W / 2, 345, '¡Nuevo récord!', { font: 'bold 22px Arial', color: '#86efac' }).setOrigin(0.5);
    }

    makeButton(this, W / 2, 410, 320, 64, next > this.level ? 'Siguiente nivel' : 'Seguir', th.accent,
      () => this.scene.start('Game', { mode: 'desafio', theme: this.themeKey, level: next }));
    makeButton(this, W / 2 - 170, 495, 280, 50, 'Descargar CSV', 0xcbd5e1, () => downloadCSV(runLog, 'desafio_' + this.themeKey));
    makeButton(this, W / 2 + 170, 495, 280, 50, 'Salir', 0xcbd5e1, () => this.scene.start('Menu', { mode: 'desafio' }));
  }
}
