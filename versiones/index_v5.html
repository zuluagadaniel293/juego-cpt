// Prueba fija: siempre los mismos parámetros, para poder comparar sesiones.
// Valores provisionales: confirmarlos con la revisión de literatura del CPT (Fase 1).
const CONFIG = {
  SESSION_MS: 120000,        // duración de la sesión (poner 20000 para probar rápido)
  STIMULUS_MS: 1000,         // tiempo que el estímulo está en pantalla

  ISI_MAX: 1400,             // pausa máxima entre estímulos
  TARGET_PROB: 0.25,         // proporción de estímulos objetivo
  AUDIO_DISTRACTOR: true,    // distractor auditivo ON/OFF
  AUDIO_EVERY_MS: [20000, 35000] // cada cuánto suena el distractor (rango aleatorio)
};

// Minijuegos: cada uno se juega distinto, pero todos miden aciertos, omisiones y comisiones.
// instr(n, holder): n = qué buscar ("a Sombra"), holder = con qué atrapar ("la canasta" / "la red")

  race:    { label: 'Carrera',   verb: 'Agarraste',   desc: 'Cambia de carril\ny agarra',
             instr: n => 'Cambia de carril con las flechas o tocando arriba/abajo.\nAgarra solo ' + n },

// Dificultad según el nivel (Desafío) o el capítulo (Historia): empieza fácil y corto.
function challengeParams(level, minigame) {
  const L = level - 1;
  const isiMin = Math.max(400, 900 - 40 * L);
  return {
    sessionMs: Math.min(45000 + 5000 * L, 120000),   // 45 s en el nivel 1, +5 s por nivel, máx. 2 min
    stimMs: Math.max(550, 1200 - 50 * L),            // Clásico: tiempo del estímulo en pantalla
    isiMin: isiMin,
    isiMax: isiMin + 600,
    targetProb: Math.max(0.2, 0.35 - 0.015 * L),     // al principio más objetivos; luego menos (vigilancia)
    similarProb: level >= 4 ? Math.min(0.5, 0.15 + 0.05 * (level - 4)) : 0, // distractor parecido al objetivo
    audio: level >= 3,
    audioEvery: [Math.max(8000, 20000 - 1000 * L), Math.max(12000, 35000 - 1500 * L)],
    travelMs: Math.max(1500, 3400 - 150 * L),        // Atrapa/Carrera: tiempo que tarda en cruzar la pantalla
    spawnMin: Math.max(550, 1300 - 60 * L),
    spawnMax: Math.max(900, 1900 - 70 * L),
    setSize: Math.min(8, 3 + Math.floor(L / 2)),     // Encuentra: cuántos objetos a la vez
    displayMs: Math.max(1500, 3200 - 120 * L),       // Encuentra: tiempo para buscar
    minigame: minigame || 'classic'
  };
}

function pruebaParams() {
  return {
    sessionMs: CONFIG.SESSION_MS,
    stimMs: CONFIG.STIMULUS_MS,
    isiMin: CONFIG.ISI_MIN,
    isiMax: CONFIG.ISI_MAX,
    targetProb: CONFIG.TARGET_PROB,
    similarProb: 0,
    audio: CONFIG.AUDIO_DISTRACTOR,
    audioEvery: CONFIG.AUDIO_EVERY_MS,
    minigame: 'classic'
  };
}

const AVAILABLE = new Set(window.ASSET_FILES || []);

function assetPath(theme, name) {
  // en Superhéroes, el objetivo y los distractores de los capítulos 1-4 son señales
  const signal = { target: 'signal_target', dist1: 'signal_1', dist2: 'signal_2', dist3: 'signal_3' };
  const file = theme === 'heroes' && signal[name] ? signal[name] : name;
  return theme + '/' + theme + '_' + file + '.png';
}
function fallbackKey(theme, name) {
  if (name === 'hero' || name === 'hero_run') return 'char_' + theme;
  if (name === 'net') return 'net';
  if (name === 'end' || name === 'villain_caught' || name.startsWith('bg_')) return null; // se generan aparte
  if (name === 'friend3' && theme !== 'heroes') return theme + '_friend1';
  return theme + '_' + name;
}
const TEX = {};   // TEX[tema][nombre] = textura a usar (archivo o dibujo provisional)

// ======================= FONDOS AMBIENTADOS =======================
// Un fondo por capítulo (idx 0-4). Si existe assets/<tema>/<tema>_bg_N.png (o .jpg) se usa la imagen;
// si no, se dibuja uno provisional. dim = cuánto se oscurece con el color del mundo (0 a 1).
function drawBackdrop(scene, theme, idx, dim) {
  const W = scene.scale.width, H = scene.scale.height;
  const key = TEX[theme]['bg_' + (idx + 1)];
  if (key) {
    const img = scene.add.image(W / 2, H / 2, key).setDepth(-20);
    img.setScale(Math.max(W / img.width, H / img.height));
  } else {
    const g = scene.add.graphics().setDepth(-20);
    const rng = new Phaser.Math.RandomDataGenerator([theme + idx]);
    BACKDROPS[theme](g, idx, rng, W, H);
  }
  if (dim > 0) scene.add.rectangle(0, 0, W, H, THEMES[theme].bg, dim).setOrigin(0).setDepth(-19);
}

function mixColor(a, b, t) {
  const c = (s) => [(s >> 16) & 255, (s >> 8) & 255, s & 255];
  const A = c(a), B = c(b);
  return (Math.round(A[0] + (B[0] - A[0]) * t) << 16) | (Math.round(A[1] + (B[1] - A[1]) * t) << 8) | Math.round(A[2] + (B[2] - A[2]) * t);
}
function skyGradient(g, top, bottom, W, H) {
  for (let y = 0; y < H; y += 10) { g.fillStyle(mixColor(top, bottom, y / H), 1); g.fillRect(0, y, W, 10); }
}

      for (let x = 30; x < W; x += 90) { const h = rng.between(30, 90); g.fillTriangle(x, H, x + 60, H, x + 30, H - h); }

      skyGradient(g, 0x7f1d1d, 0xf97316, W, H);
      g.fillStyle(0x6b7280, 0.5); for (let i = 0; i < 6; i++) g.fillCircle(480 + rng.between(-60, 60), 120 - i * 18, 30 + i * 6);

      g.fillStyle(0x15803d, 1); g.fillRect(0, 460, W, H - 460);
      for (let i = 0; i < 30; i++) { g.fillStyle([0xf472b6, 0xfde047, 0xffffff][i % 3], 1); g.fillCircle(rng.between(0, W), rng.between(420, 530), 5); }

// Usa el audio grabado (assets/<tema>/voice_N.mp3) si existe; si no, la voz del navegador.
let currentVoice = null;
function bestSpanishVoice() {
  try {
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    const score = v => (/natural|online|neural/i.test(v.name) ? 10 : 0) + (/MX|US|CO|419|AR/i.test(v.lang) ? 3 : 0) + (v.localService ? 0 : 1);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  } catch (e) { return null; }
}
function speakTTS(text, theme) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = bestSpanishVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'es-MX';
    u.pitch = STORY[theme].voice.pitch;   // tono más agudo: suena a personaje infantil
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) { /* sin voz disponible */ }
}
function playVoice(theme, id, text) {
  stopVoice();
  const file = theme + '/voice_' + id + '.mp3';
  if (!AVAILABLE.has(file)) { speakTTS(text, theme); return; }
  currentVoice = new Audio('assets/' + file);
  currentVoice.play().catch(() => speakTTS(text, theme));
}
function stopVoice() {
  if (currentVoice) { currentVoice.pause(); currentVoice = null; }
  try { window.speechSynthesis.cancel(); } catch (e) { /* nada */ }
}

// ======================= AUDIO (Web Audio, sin archivos) =======================
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, vol, type) {
  const ctx = getCtx();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + dur);
}
function distractorSound() {            // sonido disonante que funciona como distractor
  tone(220, 0.6, 0.25, 'sawtooth');
  tone(233, 0.6, 0.25, 'sawtooth');
}
function rewardSound() {                // refuerzo positivo
  tone(660, 0.12, 0.12, 'sine');
  setTimeout(() => tone(880, 0.15, 0.12, 'sine'), 90);
}

function starPoints(cx, cy, R, r) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const d = i % 2 ? r : R;
    p.push({ x: cx + d * Math.cos(a), y: cy + d * Math.sin(a) });
  }
  return p;
}

function starsText(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }

function computeStats(log) {
  const st = log.filter(r => r.event_type === 'stimulus');
  const targets = st.filter(r => r.stimulus_type === 'target');
  const dists = st.filter(r => r.stimulus_type === 'distractor');
  const hits = targets.filter(r => r.outcome === 'hit');
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
  const sd = a => {
    if (a.length < 2) return NaN;
    const m = mean(a);
    return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1));
  };
  const rts = hits.map(r => r.rt_ms);
  const lastOnset = st.length ? Math.max(...st.map(r => r.onset_ms)) : 0;
  const half = lastOnset / 2;
  return {
    trials: st.length,
    targets: targets.length,
    hits: hits.length,
    omissions: targets.length - hits.length,
    distractors: dists.length,
    // 'wrong_tap' = en Encuentra tocó otro objeto en vez del especial
    commissions: st.filter(r => r.outcome === 'commission' || r.outcome === 'wrong_tap').length,
    hitRate: targets.length ? hits.length / targets.length : 0,
    meanRT: mean(rts),
    sdRT: sd(rts),
    cv: sd(rts) / mean(rts),
    rtFirst: mean(hits.filter(r => r.onset_ms <= half).map(r => r.rt_ms)),
    rtSecond: mean(hits.filter(r => r.onset_ms > half).map(r => r.rt_ms))
  };
}

// Estrellas: premian precisión (aciertos y pocas comisiones), no velocidad.
function starsFor(s, mg) {
  const hitRate = s.targets ? s.hitRate : 1;
  const base = mg === 'find' ? s.trials : s.distractors;
  const commRate = base ? s.commissions / base : 0;
  if (hitRate >= 0.9 && commRate <= 0.1) return 3;
  if (hitRate >= 0.75 && commRate <= 0.25) return 2;
  if (hitRate >= 0.5 && commRate <= 0.4) return 1;
  return 0;
}

function downloadCSV(log, name) {
  const cols = ['event_type', 'mode', 'theme', 'level', 'chapter', 'phase', 'minigame', 'trial', 'stimulus_type', 'stimulus_key',
    'onset_ms', 'responded', 'rt_ms', 'outcome'];
  const lines = [cols.join(',')].concat(
    log.map(r => cols.map(c => (r[c] === undefined ? '' : r[c])).join(','))
  );
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cpt_' + name + '_' + Date.now() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

class ChapterMapScene extends Phaser.Scene {
  constructor() { super('ChapterMap'); }
  init(data) { this.themeKey = data.theme; }
  create() {
    const W = this.scale.width;
    const th = THEMES[this.themeKey];
    const st = STORY[this.themeKey];
    const stars = chapterStars(this.themeKey);
    this.cameras.main.setBackgroundColor(th.bg);
    const cur = stars.findIndex(s => s === 0);
    drawBackdrop(this, this.themeKey, cur < 0 ? 4 : cur, 0.55);
    backLink(this, 'Mapa', () => this.scene.start('WorldMap'));
    this.add.text(W / 2, 40, th.label, { font: 'bold 34px Arial', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W - 30, 40, '★ ' + stars.reduce((a, b) => a + b, 0) + ' / 15', { font: 'bold 22px Arial', color: '#fde047' }).setOrigin(1, 0.5);

    const pos = [[110, 400], [290, 210], [470, 400], [650, 210], [830, 310]];
    const path = this.add.graphics();
    path.lineStyle(6, 0xffffff, 0.18);
    for (let i = 0; i < pos.length - 1; i++) path.lineBetween(pos[i][0], pos[i][1], pos[i + 1][0], pos[i + 1][1]);

    const current = stars.findIndex(s => s === 0);  // primer capítulo sin superar
    CHAPTERS.forEach((ch, i) => {
      const [x, y] = pos[i];
      const r = ch.boss ? 62 : 46;
      const unlocked = i === 0 || stars[i - 1] > 0;
      const done = stars[i] > 0;
      let node;
      if (done) {
        node = this.add.circle(x, y, r, th.accent);
        if (ch.boss) fit(this.add.image(x, y, TEX[this.themeKey].villain_caught), 96);
        else this.add.text(x, y, String(i + 1), { font: 'bold 36px Arial', color: '#0f172a' }).setOrigin(0.5);
        this.add.text(x, y + r + 48, starsText(stars[i]), { font: '20px Arial', color: '#fde047' }).setOrigin(0.5);
      } else if (unlocked) {
        const glow = this.add.circle(x, y, r + 14, th.accent, 0.35);
        this.tweens.add({ targets: glow, scale: 1.15, alpha: 0.15, duration: 800, yoyo: true, repeat: -1 });
        node = this.add.circle(x, y, r, ch.boss ? 0x7c3aed : 0xffffff).setStrokeStyle(6, th.accent);
        if (ch.boss) fit(this.add.image(x, y, TEX[this.themeKey].villain), 96);
        else this.add.text(x, y, String(i + 1), { font: 'bold 36px Arial', color: '#0f172a' }).setOrigin(0.5);
        if (i === current) this.add.text(x, y + r + 50, '¡Jugar!', { font: 'bold 18px Arial', color: hexColor(th.accent) }).setOrigin(0.5);
      } else {
        node = this.add.circle(x, y, r, ch.boss ? 0x3b1f6e : 0xffffff, ch.boss ? 1 : 0.1);
        this.add.image(x, y, 'icon_lock').setScale(ch.boss ? 0.36 : 0.28);
      }
      this.add.text(x, y + r + 22, st.places[i], { font: 'bold 17px Arial', color: '#ffffff' }).setOrigin(0.5).setAlpha(unlocked ? 1 : 0.55);
      if (unlocked) {
        node.setInteractive({ useHandCursor: true });
        node.on('pointerdown', () => this.scene.start('Story', { theme: this.themeKey, chapter: i }));
      }
    });
  }
}

// ======================= ESCENA DE JUEGO (todos los minijuegos) =======================
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }
  init(data) {
    this.mode = data.mode;
    this.themeKey = data.theme;
    this.theme = THEMES[data.theme];
    this.chapter = data.chapter === undefined ? null : data.chapter;
    this.phase = data.phase || 0;
    this.prevLog = data.prevLog || [];   // jefe final: registros de la fase anterior
    this.boss = false;
    if (this.mode === 'prueba') {
      this.level = null;
      this.params = pruebaParams();
    } else if (this.mode === 'historia') {
      const ch = CHAPTERS[this.chapter];
      const spec = ch.phases ? ch.phases[this.phase] : ch;
      this.boss = !!ch.boss;
      this.level = ch.level;
      this.params = challengeParams(ch.level, spec.mg);
      this.params.sessionMs = spec.sec * 1000;
    } else {
      this.level = data.level;
      this.params = challengeParams(data.level, data.minigame);
    }
    this.mg = this.params.minigame;
    // Qué se busca: en el jefe final, el villano entre personajes amigos
    const tex = TEX[this.themeKey];
    this.keys = this.boss
      ? { target: tex.villain, dists: [tex.friend1, tex.friend2], similar: tex.friend3 }
      : { target: tex.target, dists: [tex.dist1, tex.dist2], similar: tex.dist3 };
  }

  create() {
    const W = this.scale.width, H = this.scale.height;
    const th = this.theme;
    this.cameras.main.setBackgroundColor(th.bg);
    // Fondo del capítulo/nivel: muy oscurecido al principio y más visible en niveles altos (distractor visual).
    // La Prueba fija queda con fondo liso para no cambiar las condiciones de medición.
    if (this.mode !== 'prueba') {
      const idx = this.mode === 'historia' ? this.chapter : (this.level - 1) % 5;
      drawBackdrop(this, this.themeKey, idx, Math.max(0.4, 0.85 - 0.06 * (this.level - 1)));
    }
    this.log = [];
    this.trial = 0;
    this.current = null;
    this.items = [];           // objetos en movimiento (Atrapa / Carrera)
    this.started = false;
    this.ended = false;
    this.spawningDone = false;

    // Barra de progreso, con el nivel o capítulo a la izquierda
    let barX = 40;
    const tag = this.mode === 'desafio' ? 'Nivel ' + this.level
      : this.mode === 'historia' ? (this.boss ? 'Jefe final' : 'Capítulo ' + (this.chapter + 1)) : null;
    if (tag) {
      const pill = this.add.graphics();
      pill.fillStyle(th.accent, 0.18);
      pill.fillRoundedRect(20, 6, 130, 28, 14);
      this.add.text(85, 20, tag, { font: 'bold 16px Arial', color: hexColor(th.accent) }).setOrigin(0.5);
      barX = 166;
    }
    this.barW = W - barX - 40;
    this.add.rectangle(barX, 20, this.barW, 10, 0xffffff, 0.2).setOrigin(0, 0.5);
    this.bar = this.add.rectangle(barX, 20, 0, 10, th.accent).setOrigin(0, 0.5);

    this.fb = this.add.text(W / 2, this.mg === 'classic' ? H / 2 + 140 : 70, '',
      { font: 'bold 38px Arial', color: '#86efac' }).setOrigin(0.5).setDepth(10);

    this.setupMinigame();

    // Pantalla de preparación
    let title, what;
    if (this.boss) {
      title = this.phase === 0 ? '¡Atrápalo con la red!' : '¡' + th.villain + ' escapó! ' + th.chase;
      what = th.villainObj;
    } else {
      title = tag ? tag + ' · ' + MG[this.mg].label : 'Prepárate...';
      what = th.targetObj;
    }
    const holder = this.boss ? 'la red' : 'la canasta';
    this.intro = [
      fit(this.add.image(W / 2, H / 2 - 100, this.keys.target), 160).setDepth(20),
      this.add.text(W / 2, H / 2 + 15, title, { font: 'bold 32px Arial', color: hexColor(th.accent) }).setOrigin(0.5).setDepth(20),
      this.add.text(W / 2, H / 2 + 85, MG[this.mg].instr(what, holder),
        { font: 'bold 24px Arial', color: '#ffffff', align: 'center', lineSpacing: 6 }).setOrigin(0.5).setDepth(20)
    ];
    this.time.delayedCall(this.mg === 'classic' ? 3000 : 4500, () => this.begin());
  }

  setupMinigame() {
    const W = this.scale.width, H = this.scale.height;
    this.mgObjects = [];
    if (this.mg === 'classic') {
      this.stim = this.add.image(W / 2, H / 2, this.keys.target).setVisible(false);
      this.input.keyboard.on('keydown-SPACE', () => this.respond());
      this.input.on('pointerdown', () => this.respond());
    } else if (this.mg === 'catch') {
      this.basket = fit(this.add.image(W / 2, H - 60, this.boss ? TEX[this.themeKey].net : 'basket'), this.boss ? 120 : 144).setDepth(3);
      this.mgObjects.push(this.basket);
      this.cursors = this.input.keyboard.createCursorKeys();
      const follow = p => { if (this.started) this.basket.x = Phaser.Math.Clamp(p.x, 70, W - 70); };
      this.input.on('pointermove', follow);
      this.input.on('pointerdown', follow);
      this.fallSpeed = (H - 60 + 60) / this.params.travelMs * 1000;
    } else if (this.mg === 'race') {
      this.lanes = [210, 330, 450];
      this.lane = 1;
      const road = this.add.graphics();
      road.fillStyle(0x000000, 0.22);
      road.fillRect(0, 150, W, 360);
      road.lineStyle(3, 0xffffff, 0.12);
      road.lineBetween(0, 270, W, 270); road.lineBetween(0, 390, W, 390);
      this.mgObjects.push(road);
      this.dashes = [];
      for (let i = 0; i < 9; i++) {
        const d = this.add.rectangle(i * 120, 512, 60, 6, 0xffffff, 0.3).setOrigin(0, 0.5);
        this.dashes.push(d);
        this.mgObjects.push(d);
      }
      this.runner = fit(this.add.image(170, this.lanes[1], TEX[this.themeKey].hero_run), 104).setDepth(4);
      this.mgObjects.push(this.runner);
      this.bob = this.tweens.add({ targets: this.runner, angle: { from: -4, to: 4 }, duration: 160, yoyo: true, repeat: -1 });
      this.raceSpeed = (W + 60 - 170) / this.params.travelMs * 1000;
      const move = d => {
        if (!this.started || this.ended) return;
        this.lane = Phaser.Math.Clamp(this.lane + d, 0, 2);
        this.tweens.add({ targets: this.runner, y: this.lanes[this.lane], duration: 110 });
      };
      ['UP', 'W'].forEach(k => this.input.keyboard.on('keydown-' + k, () => move(-1)));
      ['DOWN', 'S'].forEach(k => this.input.keyboard.on('keydown-' + k, () => move(1)));
      this.input.on('pointerdown', p => {
        if (p.y < this.runner.y - 30) move(-1);
        else if (p.y > this.runner.y + 30) move(1);
      });
    }
    // 'find' no necesita elementos fijos: crea los objetos en cada ronda
    this.mgObjects.forEach(o => o.setVisible(false));
  }

  begin() {
    this.intro.forEach(o => o.destroy());
    this.mgObjects.forEach(o => o.setVisible(true));
    this.t0 = performance.now();
    this.started = true;
    if (this.mg === 'classic') this.nextTrial();
    else if (this.mg === 'find') this.nextFindTrial();
    else this.scheduleSpawn();
    this.scheduleAudio();
  }

  elapsed() { return performance.now() - this.t0; }

  pickStimulus() {
    if (Math.random() < this.params.targetProb) return { type: 'target', key: this.keys.target };
    return { type: 'distractor', key: this.distractorKey() };
  }
  distractorKey() {
    if (Math.random() < this.params.similarProb) return this.keys.similar;
    return Phaser.Utils.Array.GetRandom(this.keys.dists);
  }

  logTrial(trial, type, key, onset, responded, rt, outcome) {
    this.log.push({
      event_type: 'stimulus',
      mode: this.mode,
      theme: this.themeKey,
      level: this.level || '',
      chapter: this.chapter === null ? '' : this.chapter + 1,
      phase: this.boss ? this.phase + 1 : '',
      minigame: this.mg,
      trial: trial,
      stimulus_type: type,
      stimulus_key: key,
      onset_ms: Math.round(onset - this.t0),
      responded: responded ? 1 : 0,
      rt_ms: rt === null ? '' : Math.round(rt),
      outcome: outcome
    });
  }

  update(time, delta) {
    if (!this.started || this.ended) return;
    const dt = delta / 1000;
    this.bar.width = this.barW * Math.min(1, this.elapsed() / this.params.sessionMs);
    if (this.mg === 'catch') this.updateCatch(dt);
    else if (this.mg === 'race') this.updateRace(dt);
  }

  ring(x, y) {
    const r = this.add.circle(x, y, 70).setStrokeStyle(8, 0x86efac).setDepth(6);
    this.tweens.add({ targets: r, scale: 1.6, alpha: 0, duration: 500, onComplete: () => r.destroy() });
  }
  praise() {
    rewardSound();
    this.fb.setText(this.boss ? '¡Atrapado!' : '¡Bien!').setAlpha(1);
    this.tweens.add({ targets: this.fb, alpha: 0, duration: 600 });
  }

  // ---------- Clásico: aparece un objeto; responder solo al especial ----------
  nextTrial() {
    const P = this.params;
    if (this.elapsed() >= P.sessionMs) { this.finish(); return; }
    this.trial++;
    const s = this.pickStimulus();
    fit(this.stim.setTexture(s.key).setVisible(true).setAlpha(1), 160);
    this.current = { trial: this.trial, type: s.type, key: s.key, onset: performance.now(), responded: false, rt: null };
    this.time.delayedCall(P.stimMs, () => this.endTrial());
  }
  endTrial() {
    const c = this.current;
    this.stim.setVisible(false);
    let outcome;
    if (c.type === 'target') outcome = c.responded ? 'hit' : 'omission';
    else outcome = c.responded ? 'commission' : 'correct_rejection';
    this.logTrial(c.trial, c.type, c.key, c.onset, c.responded, c.rt, outcome);
    this.current = null;
    this.time.delayedCall(Phaser.Math.Between(this.params.isiMin, this.params.isiMax), () => this.nextTrial());
  }
  respond() {
    const c = this.current;
    if (!this.started || this.ended || !c || c.responded) return;
    c.responded = true;
    c.rt = performance.now() - c.onset;
    if (c.type === 'target') {
      this.praise();
      this.ring(this.scale.width / 2, this.scale.height / 2);
    } else {
      this.stim.setAlpha(0.35);  // error de comisión: feedback neutro, sin castigo
    }
  }

  // ---------- Atrapa y Carrera: objetos en movimiento ----------
  scheduleSpawn() {
    if (this.elapsed() >= this.params.sessionMs) { this.spawningDone = true; return; }
    this.spawnItem();
    this.time.delayedCall(Phaser.Math.Between(this.params.spawnMin, this.params.spawnMax), () => this.scheduleSpawn());
  }
  spawnItem() {
    const W = this.scale.width;
    const s = this.pickStimulus();
    let img, lane = null;
    if (this.mg === 'catch') {
      const x = Phaser.Utils.Array.GetRandom([130, 290, 450, 610, 770, 850]);
      img = fit(this.add.image(x, -50, s.key), this.boss ? 100 : 88);
    } else {
      lane = Phaser.Math.Between(0, 2);
      img = fit(this.add.image(W + 60, this.lanes[lane], s.key), this.boss ? 96 : 78);
    }
    this.trial++;
    this.items.push({ img, lane, trial: this.trial, type: s.type, key: s.key, onset: performance.now(), resolved: false });
  }
  resolveItem(it, got) {
    it.resolved = true;
    const rt = got ? performance.now() - it.onset : null;
    let outcome;
    if (it.type === 'target') outcome = got ? 'hit' : 'omission';
    else outcome = got ? 'commission' : 'correct_rejection';
    this.logTrial(it.trial, it.type, it.key, it.onset, got, rt, outcome);
    if (!got) return;
    const holder = this.mg === 'catch' ? this.basket : this.runner;
    if (it.type === 'target') {
      this.praise();
      this.ring(holder.x, holder.y);
      this.tweens.add({ targets: it.img, x: holder.x, y: holder.y, scale: it.img.scale * 0.2, alpha: 0, duration: 220, onComplete: () => it.img.destroy() });
    } else {
      // agarró un distractor: feedback neutro (se desvanece y la canasta/personaje se sacude)
      this.tweens.add({ targets: it.img, alpha: 0, duration: 250, onComplete: () => it.img.destroy() });
      this.tweens.add({ targets: holder, x: holder.x + 8, duration: 60, yoyo: true, repeat: 1 });
    }
    it.gone = true;
  }
  updateCatch(dt) {
    const W = this.scale.width, H = this.scale.height;
    if (this.cursors.left.isDown) this.basket.x = Math.max(70, this.basket.x - 650 * dt);
    if (this.cursors.right.isDown) this.basket.x = Math.min(W - 70, this.basket.x + 650 * dt);
    for (const it of this.items) {
      if (it.gone) continue;
      it.img.y += this.fallSpeed * dt;
      if (!it.resolved && it.img.y >= this.basket.y - 45 && it.img.y <= this.basket.y + 5 && Math.abs(it.img.x - this.basket.x) < 80) {
        this.resolveItem(it, true);
      } else if (!it.resolved && it.img.y > this.basket.y + 5) {
        this.resolveItem(it, false);
      }
      if (!it.gone && it.img.y > H + 60) { it.img.destroy(); it.gone = true; }
    }
    this.cleanupItems();
  }
  updateRace(dt) {
    const dx = this.raceSpeed * dt;
    this.dashes.forEach(d => { d.x -= dx; if (d.x < -60) d.x += 9 * 120; });
    for (const it of this.items) {
      if (it.gone) continue;
      it.img.x -= dx;
      if (!it.resolved && it.img.x <= this.runner.x + 25) this.resolveItem(it, it.lane === this.lane);
      if (!it.gone && it.img.x < -60) { it.img.destroy(); it.gone = true; }
    }
    this.cleanupItems();
  }
  cleanupItems() {
    this.items = this.items.filter(it => !it.gone);
    if (this.spawningDone && this.items.every(it => it.resolved)) this.finish();
  }

  // ---------- Encuentra: varios objetos a la vez; tocar solo el especial ----------
  nextFindTrial() {
    const P = this.params;
    if (this.elapsed() >= P.sessionMs) { this.finish(); return; }
    this.trial++;
    const cells = [];
    for (const y of [190, 390]) for (const x of [150, 370, 590, 810]) cells.push([x, y]);
    Phaser.Utils.Array.Shuffle(cells);
    const present = Math.random() < 0.75;
    const targetIdx = present ? Phaser.Math.Between(0, P.setSize - 1) : -1;
    const ft = { trial: this.trial, present, onset: performance.now(), imgs: [], done: false };
    for (let i = 0; i < P.setSize; i++) {
      const isTarget = i === targetIdx;
      const key = isTarget ? this.keys.target : this.distractorKey();
      const [cx, cy] = cells[i];
      const img = fit(this.add.image(cx + Phaser.Math.Between(-30, 30), cy + Phaser.Math.Between(-20, 20), key), 100)
        .setInteractive({ useHandCursor: true });
      img.on('pointerdown', () => this.findTap(ft, isTarget, key, img));
      ft.imgs.push(img);
    }
    ft.timer = this.time.delayedCall(P.displayMs, () => this.findEnd(ft, null));
    this.findTrial = ft;
  }
  findTap(ft, isTarget, key, img) {
    if (ft.done || this.ended) return;
    ft.timer.remove();
    if (isTarget) { this.praise(); this.ring(img.x, img.y); }
    else img.setAlpha(0.35);  // feedback neutro
    this.findEnd(ft, { isTarget, key });
  }
  findEnd(ft, tap) {
    if (ft.done) return;
    ft.done = true;
    const rt = tap ? performance.now() - ft.onset : null;
    let outcome;
    if (ft.present) outcome = !tap ? 'omission' : tap.isTarget ? 'hit' : 'wrong_tap';
    else outcome = tap ? 'commission' : 'correct_rejection';
    this.logTrial(ft.trial, ft.present ? 'target' : 'distractor',
      tap ? tap.key : 'set_' + ft.imgs.length, ft.onset, !!tap, rt, outcome);
    this.time.delayedCall(tap ? 350 : 0, () => ft.imgs.forEach(i => i.destroy()));
    this.time.delayedCall(Phaser.Math.Between(this.params.isiMin, this.params.isiMax), () => this.nextFindTrial());
  }

  // ---------- Común ----------
  scheduleAudio() {
    const P = this.params;
    if (!P.audio) return;
    const d = Phaser.Math.Between(P.audioEvery[0], P.audioEvery[1]);
    this.time.delayedCall(d, () => {
      if (this.ended) return;
      distractorSound();
      this.log.push({
        event_type: 'audio_distractor',
        mode: this.mode,
        theme: this.themeKey,
        level: this.level || '',
        chapter: this.chapter === null ? '' : this.chapter + 1,
        phase: this.boss ? this.phase + 1 : '',
        minigame: this.mg,
        onset_ms: Math.round(this.elapsed())
      });
      this.scheduleAudio();
    });
  }

  finish() {
    if (this.ended) return;
    this.ended = true;
    // Jefe final: al terminar la fase de la red, el villano escapa y empieza la persecución
    const ch = this.mode === 'historia' ? CHAPTERS[this.chapter] : null;
    if (ch && ch.phases && this.phase < ch.phases.length - 1) {
      this.scene.start('Game', { mode: 'historia', theme: this.themeKey, chapter: this.chapter,
        phase: this.phase + 1, prevLog: this.prevLog.concat(this.log) });
      return;
    }
    const data = { log: this.prevLog.concat(this.log), theme: this.themeKey, level: this.level,
      minigame: this.mg, chapter: this.chapter, boss: this.boss };
    if (this.mode === 'desafio') this.scene.start('ChallengeResults', data);
    else if (this.mode === 'historia') this.scene.start('StoryResults', data);
    else this.scene.start('Results', data);
  }
}

// ======================= ESCENAS: RESULTADOS =======================
// Prueba fija: métricas completas para el adulto
class ResultsScene extends Phaser.Scene {
  constructor() { super('Results'); }
  init(data) {
    this.log = data.log;
    this.themeKey = data.theme;
  }
  create() {
    const W = this.scale.width;
    const th = THEMES[this.themeKey];
    this.cameras.main.setBackgroundColor(th.bg);
    const s = computeStats(this.log);
    const ms = v => (isNaN(v) ? '—' : Math.round(v) + ' ms');
    const stars = s.hitRate >= 0.9 ? 3 : s.hitRate >= 0.7 ? 2 : 1;

    this.add.text(W / 2, 55, '¡Buen trabajo!', { font: 'bold 46px Arial', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 120, starsText(stars), { font: '52px Arial', color: '#fde047' }).setOrigin(0.5);

    const lines = [
      'Objetivos detectados: ' + s.hits + ' de ' + s.targets + ' (' + Math.round(s.hitRate * 100) + '%)',
      'Omisiones (no detectó el objetivo): ' + s.omissions,
      'Respuestas a distractores (comisiones): ' + s.commissions + ' de ' + s.distractors,
      'Tiempo de reacción promedio: ' + ms(s.meanRT),
      'Variabilidad del TR (desv. estándar): ' + ms(s.sdRT),
      'TR primera mitad vs. segunda mitad: ' + ms(s.rtFirst) + ' → ' + ms(s.rtSecond)
    ];
    this.add.text(W / 2, 290, lines.join('\n'),
      { font: '24px Arial', color: '#f1f5f9', align: 'center', lineSpacing: 12 }).setOrigin(0.5);

    makeButton(this, W / 2 - 170, 470, 300, 60, 'Descargar CSV', 0xfde047, () => downloadCSV(this.log, 'prueba_' + this.themeKey));
    makeButton(this, W / 2 + 170, 470, 300, 60, 'Jugar de nuevo', 0x86efac, () => this.scene.start('Menu', { mode: 'prueba' }));
  }
}

// Texto común de resultados para el niño (estrellas + qué tan bien le fue)
function drawKidSummary(scene, s, stars, verb, title) {
  const W = scene.scale.width;
  scene.add.text(W / 2, 60, title, { font: 'bold 46px Arial', color: '#ffffff' }).setOrigin(0.5);
  scene.add.text(W / 2, 130, starsText(stars), { font: '56px Arial', color: '#fde047' }).setOrigin(0.5);
  scene.add.text(W / 2, 215, verb + ' ' + s.hits + ' de ' + s.targets +
    '\nTe equivocaste ' + s.commissions + (s.commissions === 1 ? ' vez' : ' veces'),
    { font: '24px Arial', color: '#f1f5f9', align: 'center', lineSpacing: 8 }).setOrigin(0.5);
}

// Desafío: estrellas y cambio de nivel automático
class ChallengeResultsScene extends Phaser.Scene {
  constructor() { super('ChallengeResults'); }
  init(data) {
    this.log = data.log;
    this.themeKey = data.theme;
    this.level = data.level;
    this.mg = data.minigame;
  }
  create() {
    const W = this.scale.width;
    const th = THEMES[this.themeKey];
    this.cameras.main.setBackgroundColor(th.bg);
    drawBackdrop(this, this.themeKey, (this.level - 1) % 5, 0.75);

    const runLog = (this.registry.get('runLog') || []).concat(this.log);
    this.registry.set('runLog', runLog);

    const s = computeStats(this.log);
    const stars = starsFor(s, this.mg);
    // 2 o 3 estrellas: sube · 1: repite · 0: baja para practicar
    const next = stars >= 2 ? this.level + 1 : stars === 0 ? Math.max(1, this.level - 1) : this.level;

    const records = getRecords();
    const recKey = this.themeKey + '_' + this.mg;
    const newRecord = stars >= 2 && this.level > (records[recKey] || 0);
    if (newRecord) {
      records[recKey] = this.level;
      store.set('cpt_records', records);
    }

    drawKidSummary(this, s, stars, MG[this.mg].verb,
      stars >= 2 ? '¡Excelente!' : stars === 1 ? '¡Buen intento!' : '¡Sigue practicando!');
    const msg = next > this.level ? '¡Subes al nivel ' + next + '!'
      : next < this.level ? 'Bajamos al nivel ' + next + ' para practicar'
      : 'Repite el nivel ' + this.level + ', ¡tú puedes!';
    this.add.text(W / 2, 300, msg, { font: 'bold 30px Arial', color: hexColor(th.accent) }).setOrigin(0.5);
    if (newRecord) this.add.text(W / 2, 345, '¡Nuevo récord!', { font: 'bold 22px Arial', color: '#86efac' }).setOrigin(0.5);

    makeButton(this, W / 2, 410, 320, 64, next > this.level ? 'Siguiente nivel' : 'Seguir', th.accent,
      () => this.scene.start('Game', { mode: 'desafio', theme: this.themeKey, level: next, minigame: this.mg }));
    makeButton(this, W / 2 - 170, 495, 280, 50, 'Descargar CSV', 0xcbd5e1, () => downloadCSV(runLog, 'desafio_' + this.themeKey));
    makeButton(this, W / 2 + 170, 495, 280, 50, 'Otro juego', 0xcbd5e1, () => this.scene.start('MinigameSelect', { theme: this.themeKey }));
  }
}

// Historia: guarda estrellas del capítulo y desbloquea el siguiente
class StoryResultsScene extends Phaser.Scene {
  constructor() { super('StoryResults'); }
  init(data) {
    this.log = data.log;
    this.themeKey = data.theme;
    this.chapter = data.chapter;
    this.mg = data.minigame;
    this.boss = data.boss;
  }
  create() {
    const W = this.scale.width;
    const th = THEMES[this.themeKey];
    this.cameras.main.setBackgroundColor(th.bg);
    drawBackdrop(this, this.themeKey, this.chapter, 0.75);

    const s = computeStats(this.log);
    const stars = starsFor(s, this.mg);
    const story = getStory();
    const arr = story[this.themeKey] || [0, 0, 0, 0, 0];
    arr[this.chapter] = Math.max(arr[this.chapter], stars);
    story[this.themeKey] = arr;
    store.set('cpt_story', story);

    const passed = stars >= 1;
    const title = passed ? (this.boss ? '¡Atrapaste a ' + th.villain + '!' : '¡Capítulo superado!') : '¡Casi lo logras!';
    drawKidSummary(this, s, stars, this.boss ? 'Atrapaste' : MG[this.mg].verb, title);
    this.add.text(W / 2, 300, passed ? (this.boss ? '¡Venciste el desafío final!' : '¡Se abrió el siguiente capítulo!')
      : 'Necesitas al menos 1 estrella. ¡Inténtalo otra vez!',
      { font: 'bold 26px Arial', color: hexColor(th.accent) }).setOrigin(0.5);

    if (passed && !this.boss) {
      makeButton(this, W / 2, 400, 340, 64, 'Siguiente capítulo', th.accent,
        () => this.scene.start('Story', { theme: this.themeKey, chapter: this.chapter + 1 }));
    } else if (passed) {
      makeButton(this, W / 2, 400, 340, 64, 'Ver el final', th.accent,
        () => this.scene.start('Story', { theme: this.themeKey, chapter: this.chapter, ending: true }));
    } else {
      makeButton(this, W / 2, 400, 340, 64, 'Reintentar', th.accent,
        () => this.scene.start('Game', { mode: 'historia', theme: this.themeKey, chapter: this.chapter }));
    }
    makeButton(this, W / 2 - 170, 490, 280, 50, 'Descargar CSV', 0xcbd5e1,
      () => downloadCSV(this.log, 'historia_' + this.themeKey + '_cap' + (this.chapter + 1)));
    makeButton(this, W / 2 + 170, 490, 280, 50, 'Capítulos', 0xcbd5e1, () => this.scene.start('ChapterMap', { theme: this.themeKey }));
  }
}

// ======================= ARRANQUE =======================
// Abierto con doble clic (file://), Chrome no deja usar imágenes en WebGL: se usa el modo Canvas.
new Phaser.Game({
  type: location.protocol === 'file:' ? Phaser.CANVAS : Phaser.AUTO,
  parent: 'game',
  width: 960,
  height: 540,
  backgroundColor: '#0f172a',
  loader: { imageLoadType: 'HTMLImageElement' },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, ModeScene, MenuScene, MinigameSelectScene, WorldMapScene, ChapterMapScene, StoryScene,
    GameScene, ResultsScene, ChallengeResultsScene, StoryResultsScene]
});
